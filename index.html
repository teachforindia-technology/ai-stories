  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --brand:#0ec0e2; --brand-dark:#0aa8c8; --text:#1a1a1a; }
    html, body { height:100%; width:100%; overflow:hidden; font-family:'Open Sans', system-ui, sans-serif; background:#fff; color:var(--text); }

    @keyframes fadeUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)} }
    @keyframes spin { to { transform: rotate(360deg); } }

    #splash { position:fixed; inset:0; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; z-index:999; transition:opacity .5s ease, transform .5s ease; }
    #splash.hidden { opacity:0; pointer-events:none; transform:scale(1.03); }
    .wrap { display:flex; flex-direction:column; align-items:center; gap:16px; animation:fadeUp .6s ease both; text-align:center; padding:0 24px; }
    .wrap img { width:210px; max-width:70vw; height:auto; }
    .divider { width:40px; height:4px; background:var(--brand); border-radius:99px; }
    .title { color:var(--brand); font-size:44px; font-weight:800; line-height:1.1; letter-spacing:-.01em; }
    .sub { color:#8a949b; font-size:12px; letter-spacing:2px; text-transform:uppercase; }
    .spin-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; animation:fadeUp .6s .2s ease both; }
    .spinner { width:28px; height:28px; border:3px solid #e8f9fd; border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite; }
    .loading { color:#8a949b; font-size:12px; }

    #app-frame { position:fixed; inset:0; width:100%; height:100%; border:none; display:block; }

    #error-state { display:none; position:fixed; inset:0; background:#f7feff; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:32px; text-align:center; z-index:998; }
    #error-state.visible { display:flex; }
    #error-state img { width:160px; margin-bottom:8px; }
    #error-state h2 { font-size:20px; font-weight:700; }
    #error-state p { color:#5b6770; font-size:14px; line-height:1.7; max-width:340px; }
    .btn { font:inherit; font-weight:700; border-radius:999px; padding:11px 28px; cursor:pointer; border:2px solid var(--text); background:#fff; color:var(--text); text-decoration:none; display:inline-block; }
    .btn.primary { background:var(--brand); border-color:var(--brand); color:#000; }
    .btn:hover { filter:brightness(.96); }
    .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:4px; }

    #install-banner { display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:14px 18px; border-radius:14px; box-shadow:0 8px 32px rgba(0,0,0,.25); gap:14px; align-items:center; z-index:1001; max-width:92vw; width:400px; }
    #install-banner.visible { display:flex; }
    #install-banner span { flex:1; line-height:1.5; font-size:13px; }
    #install-banner strong { color:var(--brand); }
    .btn-install { background:var(--brand); color:#000; border:none; padding:9px 18px; border-radius:8px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .btn-dismiss { background:none; border:none; color:rgba(255,255,255,.55); font-size:22px; cursor:pointer; padding:0 4px; }
    .btn-dismiss:hover { color:#fff; }
  </style>

    frame.addEventListener('load', function () {
      if (!frame.src || frame.src === 'about:blank') return;
      clearTimeout(timer);
      setTimeout(function () { splash.classList.add('hidden'); }, 900);
    });

    document.getElementById('btn-retry').addEventListener('click', load);
    load();

    // PWA install prompt
    var deferredPrompt = null;
    var banner = document.getElementById('install-banner');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(function () { banner.classList.add('visible'); }, 3500);
    });
    document.getElementById('btn-install').addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; banner.classList.remove('visible'); });
    });
    document.getElementById('btn-dismiss').addEventListener('click', function () { banner.classList.remove('visible'); deferredPrompt = null; });
    window.addEventListener('appinstalled', function () { banner.classList.remove('visible'); });
  </script>
</body>
</html>
